# Продакшен-подобный стенд на хостинге. Все образы берутся из ghcr.io (см. .github/workflows/publish.yml):
# сервер в РФ не обращается к Docker Hub. Запуск: make deploy
name: veildeck


services:
  nginx:
    image: ${IMAGE_PREFIX:-ghcr.io/alexandrag-code/veildeck}-web:${IMAGE_TAG:-latest}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
    depends_on:
      - api
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/alexandrag-code/veildeck}-api:${IMAGE_TAG:-latest}
    environment:
      ENV: ${ENV}
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@postgres:5432/veildeck
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      FERNET_KEY: ${FERNET_KEY}
      HMAC_KEY: ${HMAC_KEY}
      WM_KEY: ${WM_KEY}
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [edge, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  db-init:
    image: ${IMAGE_PREFIX:-ghcr.io/alexandrag-code/veildeck}-api:${IMAGE_TAG:-latest}
    command: ["python", "-m", "scripts.bootstrap_db"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://app_owner:${POSTGRES_PASSWORD}@postgres:5432/veildeck
      APP_RW_PASSWORD: ${APP_RW_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: ${IMAGE_PREFIX:-ghcr.io/alexandrag-code/veildeck}-postgres:16-alpine
    environment:
      POSTGRES_DB: veildeck
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d veildeck"]
      interval: 5s
      retries: 10
    networks: [data]
    restart: unless-stopped

  redis:
    image: ${IMAGE_PREFIX:-ghcr.io/alexandrag-code/veildeck}-redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [data]
    restart: unless-stopped

  mailpit:
    image: ${IMAGE_PREFIX:-ghcr.io/alexandrag-code/veildeck}-mailpit:v1.31.4
    # Только с самого сервера; наружу через SSH-туннель: ssh -L 8025:127.0.0.1:8025 user@сервер
    ports:
      - "127.0.0.1:8025:8025"
    networks: [edge, data]
    restart: unless-stopped

networks:
  edge: {}
  data:
    internal: true

volumes:
  pgdata: {}
