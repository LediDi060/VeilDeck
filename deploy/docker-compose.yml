# nginx — единственная точка входа (same-origin). Сети: edge (наружу) и data (internal, без выхода в интернет).
name: veildeck

services:
  nginx:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    build: ../backend
    environment:
      ENV: ${ENV}
      DATABASE_URL: postgresql+asyncpg://app_rw:${APP_RW_PASSWORD}@postgres:5432/veildeck
      REDIS_URL: redis://redis:6379/0
      SESSION_SECRET: ${SESSION_SECRET}
      FERNET_KEY: ${FERNET_KEY}
      HMAC_KEY: ${HMAC_KEY}
      WM_KEY: ${WM_KEY}
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [edge, data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  db-init:
    build: ../backend
    command: ["python", "-m", "scripts.bootstrap_db"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://app_owner:${POSTGRES_PASSWORD}@postgres:5432/veildeck
      APP_RW_PASSWORD: ${APP_RW_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veildeck
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d veildeck"]
      interval: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [data]

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"
    networks: [edge, data]

networks:
  edge: {}
  data:
    internal: true

volumes:
  pgdata: {}
