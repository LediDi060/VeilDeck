name: CI

on:
  pull_request:
  push:
    branches: [main]

# Минимальные права (задача 9.3). Секреты в проверках не используются, поэтому PR из форков безопасны.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veildeck_test
          POSTGRES_USER: app_owner
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_owner -d veildeck_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_OWNER_URL: postgresql+asyncpg://app_owner:synthetic-ci-only@localhost:5432/veildeck_test
      TEST_APP_RW_PASSWORD: synthetic-ci-app-password-32-characters
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: Архитектурные контракты (import-linter)
        run: lint-imports
      - name: pytest (включая tests/architecture и tests/security)
        run: pytest -q
      - name: bandit (SAST)
        run: bandit -q -r app
      - name: pip-audit (SCA)
        run: pip-audit -r requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn tsc -b
      - run: yarn lint
      - name: Архитектура FSD (Steiger)
        run: yarn steiger
      - run: yarn format
      - run: yarn test
      - run: yarn build
      - name: yarn audit (SCA, только production, High и выше)
        run: yarn audit --groups dependencies --level high

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: pip install -r backend/requirements.txt
      - name: Перегенерировать OpenAPI из кода
        working-directory: backend
        run: python -m scripts.export_openapi
      - name: Перегенерировать клиент фронта
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile
          rm -rf src/shared/api/generated
          yarn api:generate
      - name: Закоммиченные контракт и клиент совпадают с кодом
        run: |
          git add -N docs/api frontend/src/shared/api/generated
          git diff --exit-code -- docs/api frontend/src/shared/api/generated \
            || { echo "::error::openapi.json или frontend/src/shared/api/generated устарели: запустите экспорт и генерацию локально и закоммитьте"; exit 1; }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (секреты в коде и истории)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --verbose
      - name: Semgrep (SAST)
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.97.0 semgrep scan --config p/python --config p/typescript --config p/dockerfile --error --exclude frontend/src/shared/api/generated /src
      - name: Trivy (зависимости, секреты, конфиги; High и Critical блокируют)
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.65.0
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress /src
      - name: SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-artifact-retention: 14
